# Configuracion SOLO para las pruebas: base H2 en memoria en modo MySQL
spring.datasource.url=jdbc:h2:mem:supermercado;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=optional:classpath:no-existe.sql
spring.sql.init.data-locations=classpath:datos-prueba.sql
logging.file.name=
