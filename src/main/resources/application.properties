spring.application.name=supermercado-mcp

# ---------- Servidor MCP (Spring AI) ----------
spring.ai.mcp.server.name=supermercado-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.instructions=Servidor de un supermercado a domicilio. Antes de crear un pedido, busca los productos para obtener su id y confirma con el cliente los productos, cantidades, direccion y total.

# Puerto 8089 para no chocar con el labmcp de tareas (8088)
server.port=8089

# ---------- Base de datos MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/supermercado_mcp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=${PWD_UDEA}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Las tablas las crea schema.sql; Hibernate solo valida/ajusta
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- Logs ----------
logging.file.name=./logs/supermercado-mcp.log
logging.level.root=INFO
logging.level.org.springframework.ai=DEBUG
